# =====================================================================
# AuraBox MPD Configuration - Hi-Fi Low-Latency Embedded Audio Server
# =====================================================================

music_directory         "/music"
playlist_directory      "/var/lib/mpd/playlists"
db_file                 "/var/lib/mpd/database"
log_file                "/var/lib/mpd/log"
pid_file                "/var/lib/mpd/pid"
state_file              "/var/lib/mpd/state"
sticker_file            "/var/lib/mpd/sticker.sql"

user                    "root"
bind_to_address         "/run/mpd/socket"
bind_to_address         "0.0.0.0"
port                    "6600"
log_level               "default"
auto_update             "yes"
auto_update_depth       "10"

# Memoria y buffers para reproducción ultra-fluida sin cortes
audio_buffer_size       "4096"
buffer_before_play      "20%"
max_output_buffer_size  "16384"
connection_timeout      "300"
max_connections         "30"

# Opciones audiófilas de ecualización y ganancia
replaygain              "auto"
replaygain_preamp       "0"
volume_normalization    "yes"

# ---------------------------------------------------------------------
# Salidas de Audio Conmutables
# ---------------------------------------------------------------------

# 1. Salida Altavoces / Auriculares del Sistema (PipeWire / PulseAudio)
audio_output {
    type        "pulse"
    name        "Altavoces del Sistema (PipeWire / PulseAudio)"
    server      "unix:/tmp/pulse-socket"
    mixer_type  "software"
}

# 2. Salida Jack analógico 3.5mm integrado (Raspberry Pi snd_bcm2835 / ALSA default)
audio_output {
    type        "alsa"
    name        "Jack 3.5mm Analógico (snd_bcm2835)"
    device      "default"
    mixer_type  "software"
}

# 3. Salida DAC USB Externo (dispositivos USB Plug & Play en hw:1,0)
audio_output {
    type        "alsa"
    name        "DAC USB Externo (hw:1,0)"
    device      "hw:1,0"
    mixer_type  "hardware"
}

# 4. Salida DAC I2S HAT (HiFiBerry DAC+, Allo Boss, IQaudio)
audio_output {
    type        "alsa"
    name        "DAC I2S HAT (HiFiBerry/Allo)"
    device      "hw:CARD=sndrpihifiberry,DEV=0"
    mixer_type  "hardware"
}

# 5. Transmisión Web HTTP (Hi-Fi Stream para escuchar en el smartphone o navegador)
audio_output {
    type        "httpd"
    name        "Transmisión Web HTTP (Hi-Fi Stream)"
    encoder     "lame"
    port        "4082"
    bind_to_address "0.0.0.0"
    bitrate     "320"
    format      "44100:16:2"
    max_clients "10"
    always_on   "yes"
    tags        "no"
}

