services:
  # =====================================================================
  # AuraBox - Servidor Web PWA, API REST y Motor Smart Mix
  # =====================================================================
  aurabox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurabox-core
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "4080:4080"  # Interfaz Web HTTP y redirección automática
      - "4443:4443"  # Interfaz Web HTTPS nativo (TLS rango 4000)
      - "127.0.0.1:4081:4081"  # Métricas y Admin restringidos a loopback local
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    group_add:
      - "audio"
    device_cgroup_rules:
      - "c 116:* rmw"
    environment:
      - PORT=4080
      - GOMEMLIMIT=200MiB
      - HTTPS_PORT=${HTTPS_PORT:-4443}
      - HTTPS_PUBLIC_PORT=${HTTPS_PUBLIC_PORT:-4443}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - TLS_EXTRA_HOSTS=${TLS_EXTRA_HOSTS:-}
      - ADMIN_PORT=4081
      - MPD_SOCKET=/run/mpd/socket
      - MPD_HOST=mpd
      - MPD_PORT=6600
      - MUSIC_LOCAL=/music/local
      - MUSIC_NAS=/music/nas
      - MUSIC_USB=/music/usb
      - DATA_DIR=/app/data
      - NAS_ALIAS=${NAS_ALIAS:-mi-nas}
      - NAS_HOST=${NAS_HOST:-}
      - NAS_SHARE=${NAS_SHARE:-music}
      - NAS_USER=${NAS_USER:-guest}
      - NAS_PASS=${NAS_PASS:-}
      - NAS_OPTIONS=${NAS_OPTIONS:-vers=3.0,sec=ntlmssp,ro,iocharset=utf8}
    volumes:
      # Puntos de montaje de almacenamiento de música y bus ALSA dinámico (hotplug USB DAC)
      - /dev/snd:/dev/snd
      - ./music/local:/music/local:ro
      - nas_music:/music/nas:ro
      - ./music/usb:/music/usb:ro
      # Persistencia de base de datos SQLite, socket MPD y caché de carátulas
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./web:/app/web:ro
      - mpd_run:/run/mpd
    depends_on:
      - mpd
    pid: "service:mpd"
    networks:
      - aurabox-net

  # =====================================================================
  # MPD - Music Player Daemon (Motor de audio Hi-Fi y ALSA directo)
  # =====================================================================
  mpd:
    build:
      context: .
      dockerfile: docker/mpd/Dockerfile
    container_name: aurabox-mpd
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - "6600"  # Puerto de control MPD interno (expuesto solo en aurabox-net)
      - "4082"  # Stream HTTP Hi-Fi interno (proxeado en /api/stream por AuraBox)
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    group_add:
      - "audio"
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd
      - ./config/mpd.conf:/etc/mpd.conf:ro
      - ./data/mpd:/var/lib/mpd
      - mpd_run:/run/mpd
      - ./music/local:/music/local:ro
      - nas_music:/music/nas:ro
      - ./music/usb:/music/usb:ro
      - ${PULSE_SOCKET:-/dev/null}:/tmp/pulse-socket:ro
      - ${PULSE_COOKIE:-/dev/null}:/root/.config/pulse/cookie:ro
    networks:
      - aurabox-net

volumes:
  mpd_run:
  nas_music:
    driver: local
    driver_opts:
      type: cifs
      device: "//${NAS_HOST:-192.168.1.100}/${NAS_SHARE:-music}"
      o: "username=${NAS_USER:-guest},password=${NAS_PASS:-},${NAS_OPTIONS:-vers=3.0,sec=ntlmssp,ro,iocharset=utf8}"

networks:
  aurabox-net:
    driver: bridge
